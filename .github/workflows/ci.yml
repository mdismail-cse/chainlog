name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: zsh and dash for the stub contract tests
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh dash shellcheck
      - run: make lint
      - run: make version-check
      - run: make test
      - run: make dist
