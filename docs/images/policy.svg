<svg xmlns="http://www.w3.org/2000/svg" width="942" height="293" viewBox="0 0 942 293" font-family="SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="14">
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<rect width="100%%" height="32" rx="10" fill="#161b22"/><rect y="22" width="100%%" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f56"/><circle cx="40" cy="16" r="6" fill="#ffbd2e"/><circle cx="60" cy="16" r="6" fill="#27c93f"/>
<text x="471" y="21" fill="#8b949e" font-size="12" text-anchor="middle">choose what happens to forgotten sessions</text>
<text x="18" y="59" xml:space="preserve"><tspan fill="#e6edf3"><tspan fill="#7ee787">$</tspan> chainlog setup policy</tspan></text>
<text x="18" y="80" xml:space="preserve"></text>
<text x="18" y="101" xml:space="preserve"><tspan fill="#e6edf3">What should happen when you forget to save a session?</tspan></text>
<text x="18" y="122" xml:space="preserve"><tspan fill="#e6edf3">When a session ends and you haven't saved it within 10m, chainlog should:</tspan></text>
<text x="18" y="143" xml:space="preserve"><tspan fill="#e6edf3">  1) Auto-save it with a short summary of the session    (nothing is ever lost)</tspan></text>
<text x="18" y="164" xml:space="preserve"><tspan fill="#e6edf3">  2) Keep it in your "unsaved" list with a preview of the last work   (you decide later)</tspan></text>
<text x="18" y="185" xml:space="preserve"><tspan fill="#e6edf3">  3) Remind you with a pop-up notification</tspan></text>
<text x="18" y="206" xml:space="preserve"><tspan fill="#e6edf3">  4) Do nothing</tspan></text>
<text x="18" y="227" xml:space="preserve"><tspan fill="#e6edf3">Choose [1-4] (Enter = keep list): </tspan></text>
<text x="18" y="248" xml:space="preserve"><tspan fill="#e6edf3">✓ Forgotten sessions: keep them in the Unsaved list (10m after the session ends).   [unsaved.action = list]</tspan></text>
<text x="18" y="269" xml:space="preserve"><tspan fill="#e6edf3">Check everything with: chainlog doctor</tspan></text>
</svg>
