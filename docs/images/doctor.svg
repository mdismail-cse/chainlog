<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="545" viewBox="0 0 1060 545" font-family="SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="14">
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
