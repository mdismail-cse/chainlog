<text x="530" y="21" fill="#8b949e" font-size="12" text-anchor="middle">health check</text>
<text x="18" y="59" xml:space="preserve"><tspan fill="#e6edf3"><tspan fill="#7ee787">$</tspan> chainlog doctor</tspan></text>
<text x="18" y="80" xml:space="preserve"><tspan fill="#7ee787">✓ chainlog works.</tspan><tspan fill="#e6edf3"> 6 suggestions below (marked !), all optional.</tspan></text>
<text x="18" y="101" xml:space="preserve"></text>
<text x="18" y="122" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">✓</tspan><tspan fill="#e6edf3"> Python                 Python 3.14.7</tspan></text>
<text x="18" y="143" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">!</tspan><tspan fill="#e6edf3"> chainlog command       not available in your Terminal yet</tspan></text>
<text x="18" y="164" xml:space="preserve"><tspan fill="#e6edf3">                          </tspan><tspan fill="#8b949e">→ chainlog setup cli   (or run install.sh)</tspan></text>
<text x="18" y="185" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">✓</tspan><tspan fill="#e6edf3"> version                0.1.0</tspan></text>
<text x="18" y="206" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">!</tspan><tspan fill="#e6edf3"> Claude Code            not connected: chainlog can't tell exactly which session you left</tspan></text>
<text x="18" y="227" xml:space="preserve"><tspan fill="#e6edf3">                          </tspan><tspan fill="#8b949e">→ chainlog setup claude</tspan></text>
<text x="18" y="248" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">!</tspan><tspan fill="#e6edf3"> Codex                  not connected (sessions are still listed and searchable)</tspan></text>
<text x="18" y="269" xml:space="preserve"><tspan fill="#e6edf3">                          </tspan><tspan fill="#8b949e">→ chainlog setup codex</tspan></text>
<text x="18" y="290" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">✓</tspan><tspan fill="#e6edf3"> Codex approval         not needed yet</tspan></text>
<text x="18" y="311" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">!</tspan><tspan fill="#e6edf3"> Codex skills           chainlog-save (missing), chainlog-find (missing)</tspan></text>
<text x="18" y="332" xml:space="preserve"><tspan fill="#e6edf3">                          </tspan><tspan fill="#8b949e">→ chainlog setup codex</tspan></text>
<text x="18" y="353" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">✓</tspan><tspan fill="#e6edf3"> private notes folder   ~/.local/share/chainlog is private</tspan></text>
<text x="18" y="374" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">!</tspan><tspan fill="#e6edf3"> old sessions           Claude Code deletes sessions 30 days after last use, so older ones can't be reopened (optional)</tspan></text>
<text x="18" y="395" xml:space="preserve"><tspan fill="#e6edf3">                          </tspan><tspan fill="#8b949e">→ to keep them longer, add "cleanupPeriodDays": 90 to ~/.claude/settings.json</tspan></text>
<text x="18" y="416" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">✓</tspan><tspan fill="#e6edf3"> notes file             ok</tspan></text>
<text x="18" y="437" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">✓</tspan><tspan fill="#e6edf3"> pending updates        none waiting</tspan></text>
<text x="18" y="458" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">✓</tspan><tspan fill="#e6edf3"> sessions found         8 Claude, 1 Codex</tspan></text>
<text x="18" y="479" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">!</tspan><tspan fill="#e6edf3"> Terminal reminder      off (optional)</tspan></text>
<text x="18" y="500" xml:space="preserve"><tspan fill="#e6edf3">                          </tspan><tspan fill="#8b949e">→ chainlog setup shell</tspan></text>
<text x="18" y="521" xml:space="preserve"><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">✓</tspan><tspan fill="#e6edf3"> if you forget to save  keep a list, 10m after a session ends</tspan></text>
