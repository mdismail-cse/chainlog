<svg xmlns="http://www.w3.org/2000/svg" width="1211" height="230" viewBox="0 0 1211 230" font-family="SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="14">
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<rect width="100%%" height="32" rx="10" fill="#161b22"/><rect y="22" width="100%%" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f56"/><circle cx="40" cy="16" r="6" fill="#ffbd2e"/><circle cx="60" cy="16" r="6" fill="#27c93f"/>
<text x="605" y="21" fill="#8b949e" font-size="12" text-anchor="middle">after /exit — one command saves it</text>
<text x="18" y="59" xml:space="preserve"><tspan fill="#e6edf3"><tspan fill="#7ee787">$</tspan> claude</tspan></text>
<text x="18" y="80" xml:space="preserve"><tspan fill="#8b949e">  … you test the coupon rounding fix, then type /exit …</tspan></text>
<text x="18" y="101" xml:space="preserve"><tspan fill="#79c0ff">chainlog ▸ ended unsaved: </tspan><tspan fill="#e6edf3">claude 9b8c7d6e "Shop PR 4321 coupon rounding" · 49m · shop#4321 — </tspan><tspan fill="#e6edf3" font-weight="700">chainlog save "…"</tspan><tspan fill="#8b949e">  (or later: chainlog review)</tspan></text>
<text x="18" y="122" xml:space="preserve"><tspan fill="#e6edf3"><tspan fill="#7ee787">$</tspan> chainlog save "r4: rounding fixed, all 14 refund cases pass" -s pass</tspan></text>
<text x="18" y="143" xml:space="preserve"><tspan fill="#7ee787">✓</tspan><tspan fill="#e6edf3"> saved  claude 9b8c7d6e  "Shop PR 4321 coupon rounding"  status </tspan><tspan fill="#7ee787">pass</tspan></text>
<text x="18" y="164" xml:space="preserve"><tspan fill="#e6edf3">  chain  shop#4321 · round 4 </tspan><tspan fill="#8b949e">(found the PR link)</tspan><tspan fill="#8b949e">   — wrong PR? chainlog save --id 9b8c7d6e -c &lt;PR number&gt;</tspan></text>
<text x="18" y="185" xml:space="preserve"><tspan fill="#e6edf3">  how    it ran in this terminal window, ended 40s ago</tspan></text>
<text x="18" y="206" xml:space="preserve"><tspan fill="#e6edf3">  reopen chainlog next 'shop#4321'</tspan></text>
</svg>
